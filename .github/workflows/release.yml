name: Release
on:
  push:
    branches: [main, beta, alpha]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - beta
          - alpha
      skip_tests:
        description: 'Skip running tests'
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    
    services:
      pdns-auth:
        image: powerdns/pdns-auth-49:latest
        ports:
          - 8081:8081
        env:
          PDNS_AUTH_API_KEY: "apikey"
        options: >-
          --health-cmd "pdnsutil list-all-zones || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    container: 
      image: node:22
      env:
        NODE_ENV: development
        PDNS_HOST: pdns-auth
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: npm test
        
      - name: Build package
        run: npm run build
      
      - name: Install Semantic Release plugins
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git
      
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release