name: Basic workflow
on: 
  push:

jobs:
  test:
    name: "Jest test"
    runs-on: ubuntu-latest
    services:
      pdns-auth:
        image: powerdns/pdns-auth-49:latest
        ports:
          - 8081:8081
        options: >-
          --entrypoint "sh"
          --health-cmd "pdnsutil list-all-zones || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -c "echo 'local-address=0.0.0.0,::
          launch=lmdb
          lmdb-lightning-stream
          lmdb-shards=1

          webserver
          api
          api-key=apikey
          webserver-address=0.0.0.0
          webserver-allow-from=0.0.0.0/0
          webserver-password=apikey' > /etc/powerdns/pdns.conf && /usr/sbin/pdns_server"
    container: 
      image: node:22
      env:
        NODE_ENV: development
        PDNS_HOST: pdns-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm run test