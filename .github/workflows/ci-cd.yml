name: CI/CD Pipeline
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - beta
          - alpha

jobs:
  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    services:
      pdns-auth:
        image: powerdns/pdns-auth-49:latest
        ports:
          - 8081:8081
        env:
          PDNS_AUTH_API_KEY: "apikey"
        options: >-
          --health-cmd "pdnsutil list-all-zones || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    container: 
      image: node:22
      env:
        NODE_ENV: development
        PDNS_HOST: pdns-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm run test

  release:
    name: "Release Package"
    needs: test
    if: |
      success() && 
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/beta' || 
       github.ref == 'refs/heads/alpha' || 
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.inputs.branch || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release